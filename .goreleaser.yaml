# GoReleaser configuration for jms-client.
#
# Produces one static binary per platform, a checksums file, and the MCPB
# bundle that carries all of them (see mcpb/ and the mcpb-bundle hook
# below). Every target is built with CGO disabled, which is what makes the
# binaries portable: the bundle ships them pre-compiled, so a user needs no
# Go toolchain.
#
#   goreleaser release --snapshot --clean   # local dry run, no publish
#   goreleaser release --clean              # publish on a tag
#
# Docs: https://goreleaser.com

version: 2

project_name: jms-client

before:
  hooks:
    - go mod verify
    # The suite gates the release: a red test must not become a published
    # binary, which is the whole point of releasing from CI rather than a
    # laptop.
    - go test ./...

builds:
  - id: jms
    main: ./cmd/jms
    binary: jms
    env:
      - CGO_ENABLED=0
    # -s -w strips the symbol table and DWARF data, cutting roughly a third
    # off each binary. The bundle ships six of them, so the saving is worth
    # losing symbolised stack traces in a released build.
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/MiFaZhan/jms-client/internal/cli.Version=v{{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # 32-bit targets are not built: the bundle and the release both target
    # machines that run a 64-bit AI desktop client.

archives:
  - id: jms-archive
    ids:
      - jms
    # tar.gz everywhere except Windows, where zip is what users expect.
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # Release notes are written by hand in the GitHub release; GoReleaser's
  # generated list duplicates them and, with a squashed history, is noise.
  disable: true

release:
  draft: true
  # The MCPB bundle is uploaded by the mcpb-bundle hook below, which runs
  # after the binaries exist. draft:true keeps the release unpublished until
  # a human has confirmed the bundle is attached and the SHA-256 in
  # mcpb/server.json matches it.
  replace_existing_artifacts: true

# Scoop: writes bucket/jms-client.json into a repository of our own, which
# users add with `scoop bucket add`. No review queue, so a release is
# installable as soon as the tag is pushed.
scoops:
  - name: jms-client
    # The repository must already exist and the token must be able to push to
    # it; GoReleaser writes the manifest, it does not create the repo.
    repository:
      owner: MiFaZhan
      name: scoop-bucket
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    # A single manifest works for every architecture: Scoop picks the
    # matching url/arch block itself, so unlike the MCPB bundle this needs no
    # launcher.
    url_template: "https://github.com/MiFaZhan/jms-client/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: https://github.com/MiFaZhan/jms-client
    description: JumpServer v4 bastion CLI and MCP server
    license: MIT
    skip_upload: true

# Winget: generates the manifest that would be submitted to
# microsoft/winget-pkgs. skip_upload keeps it in dist/ for now: the real
# submission is a pull request against a repository we do not control, and
# that should be a deliberate step rather than a side effect of tagging.
winget:
  - name: jms-client
    package_identifier: MiFaZhan.jms-client
    publisher: MiFaZhan
    publisher_url: https://github.com/MiFaZhan
    publisher_support_url: https://github.com/MiFaZhan/jms-client/issues
    license: MIT
    license_url: https://github.com/MiFaZhan/jms-client/blob/main/LICENSE
    copyright: MiFaZhan
    short_description: JumpServer v4 bastion CLI and MCP server
    description: >-
      Access the assets behind a JumpServer v4 bastion host: list authorized
      assets, run commands, and transfer files over SFTP. Also runs as a stdio
      MCP server so an AI assistant can reach the same pooled connections.
    homepage: https://github.com/MiFaZhan/jms-client
    # The Windows archives are the ones winget installs; the tar.gz files are
    # for macOS and Linux and are not part of the manifest.
    ids:
      - jms-archive
    skip_upload: true

# The bundle is assembled by a script rather than a native GoReleaser
# feature: MCPB is a zip with a manifest and a launcher, and no packager
# exists for it yet.
announce:
  skip: true
